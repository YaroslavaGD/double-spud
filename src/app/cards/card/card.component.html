<button
  class="card"
  [class.card--hidden]="!card.isVisible"
  [disabled]="!card.isVisible"
  (click)="displayDetails()"
>
  <div class="card__background" *ngIf="!card.isOpen">
    <img
      class="card__image--cover"
      [src]="'/assets/ui/card_cover.png'"
      alt=""
    />
  </div>
  <div *ngIf="card.isOpen">
    <img class="card__image" [src]="card.image" alt="" />
    <p>{{ card.id }}</p>
  </div>
</button>
